spring.application.name=karbonzero

# Carga las variables desde un archivo .env local (si existe). Las variables de entorno reales
# (por ejemplo, las Config Vars de Heroku) tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties]
# Puerto local por defecto (la API central usa 8080). En Heroku se usa la variable PORT.
server.port=${SERVER_PORT:8081}

# DATABASE
spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USER}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name = ${DB_DRIVER}

security.jwt.secret=${SECRET_KEY_JWT}
security.jwt.issuer=${SECURITY_JWT_ISSUER}
security.jwt.expiration=${JWT_EXPIRATION}

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.required=true

# CHANNELS
external.api.key=${EXTERNAL_API_KEY}
external.api.domain=${EXTERNAL_DOMAIN}